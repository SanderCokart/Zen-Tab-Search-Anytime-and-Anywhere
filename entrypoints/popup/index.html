<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zen Tab Search</title>
    <!-- Ensure WXT generates browser_action (MV2) for the popup -->
    <meta name="manifest.type" content="browser_action" />
    <!-- Size the popup chrome before Tailwind finishes loading -->
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        padding: 8px;
        width: 380px;
        min-height: 120px;
        max-height: 420px;
        background: #1e1e1e;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
